# lorenz: role = dev system (design decisions are made here).
# Sensors, IC box, horizon, nz and alpha carried over from the archive's audited configs.
# t_ref (input protocol v2, signals.py): seconds per signal time unit. Rule t_ref = max(1, tau_slow / 3),
# rounded, with tau_slow = median 1/|Re eig| of the linearisation along the zero-input trajectory
# = 0.08 s (chaotic: fast local contraction) -> t_ref = 1.
# T / t_ref = 50 / 1 = 50 signal time units (rule: >= ~20, so an episode holds enough input events).
name: lorenz
plant: lorenz
role: dev
params: {}
sensors: [1]
ic_box:
- [-20, 20]
- [-30, 30]
- [0, 50]
T: 50
nz: 7
alpha: 2.0
u_scale: 1.0
t_ref: 1
u_bounds: []
actuator: {kind: saturating, u_bar: 2.0}
mismatch: 0.0
