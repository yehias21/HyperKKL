# bioreactor: role = dev system (design decisions are made here).
# Sensors, IC box, horizon, nz and alpha carried over from the archive's audited configs.
# t_ref (input protocol v2, signals.py): seconds per signal time unit. Rule t_ref = max(1, tau_slow / 3),
# rounded, with tau_slow = median 1/|Re eig| of the linearisation along the zero-input trajectory
# = 0.9 s -> t_ref = 1. T / t_ref = 100 / 1 = 100 signal time units (rule: >= ~20, so an episode holds enough input events).
name: bioreactor
plant: bioreactor
role: dev
params: {mu_max: 1.0}
sensors: [1]
ic_box:
- [0.8, 2.0]
- [0.2, 2.0]
T: 100
nz: 5
alpha: 0.5
u_scale: 0.15
t_ref: 1
u_bounds: [-0.25, 0.6]
actuator: {kind: saturating, u_bar: 2.0}
mismatch: 0.0
