# highway_traffic: role = test system (held out: frozen recipe only).
# Sensors, IC box, horizon, nz and alpha carried over from the archive's audited configs.
# t_ref (input protocol v2, signals.py): seconds per signal time unit. Rule t_ref = max(1, tau_slow / 3),
# rounded, with tau_slow = median 1/|Re eig| of the linearisation along the zero-input trajectory
# = 29 s -> t_ref = 10. T / t_ref = 200 / 10 = 20 signal time units (rule: >= ~20, so an episode holds enough input events).
# T raised 100 -> 200 s (v2) so that T / t_ref >= 20 (it was 10).
name: highway_traffic
plant: highway_traffic
role: test
params: {}
sensors: [0, 2, 4]
ic_box:
- &id001 [0.01, 0.1]
- *id001
- *id001
- *id001
- *id001
T: 200
nz: 12
alpha: 0.5
u_scale: 0.15
t_ref: 10
u_bounds: [-0.25, 0.6]
actuator: {kind: saturating, u_bar: 2.0}
mismatch: 0.0
