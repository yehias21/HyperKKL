id: C3-faults
parent: C1-where
title: When does a learned KKL observer beat classical filters? Sensor faults, input faults, poor
  init, plant drift
contribution: C3
question: Against EKF, UKF, PF, model-based KKL and NLOX (nominal model, oracle noise for clean),
  and against robust (Huber) and condition-oracle filters, under which conditions do the learned
  observers win?
hypothesis: Filters win on clean, well-modelled data. Learned observers win under plant drift
  and gross sensor faults against NOMINAL filters; robust/oracle filters close part of that gap.
decision_rule: Per condition, count dev systems where the best learned observer beats the best
  filter (nominal, and separately the best of robust/oracle) with a paired CI excluding 0. A 'learned
  wins' regime needs >= 4/6 systems against the best filter of either kind.
