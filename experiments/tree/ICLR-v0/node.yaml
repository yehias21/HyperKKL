title: 'SUPERSEDED (tmlr latent/hyper on the [coll, traj] base), ICLR workshop revision: Static (latent) vs Dynamic (hyper) HyperKKL on the paper''s four
  systems, 5 seeds'
contribution: iclr
question: Do the claims of Tables 1-2 hold on the Appendix A systems with 5 seeds, an EKF reference,
  the paper's per-input columns (fam_*), zero-input consistency, noisy inputs and noisy y (id-tier
  conditions) and out-of-range input amplitude (amp2, amp4)? Covers reviewer rows 4, 5, 7, 8,
  10.
hypothesis: Input conditioning lowers the error under forcing on duffing, vdp and rossler; on
  lorenz it does not; every conditioned variant equals the autonomous observer at zero input (exact
  by construction here).
decision_rule: Per system and tier, paired relative NRMSE change vs autonomous with 95% bootstrap
  CI over seeds x episodes; a claim of Tables 1-2 is kept only where the CI excludes 0 in its
  direction.
