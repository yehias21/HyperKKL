- lora[phase1.optimizer=soap,phase1.lr=0.01,phase2.optimizer=soap,phase2.lr=0.01,phase1.steps_enc=400,phase1.steps_dec=400,phase2.ctx_guard=true,phase2.delta_curv=0.0001,phase2.delta_reg=0.001,phase2.enc_aux=true]@gru
- lora[phase1.optimizer=soap,phase1.lr=0.01,phase2.optimizer=soap,phase2.lr=0.01,phase1.steps_enc=400,phase1.steps_dec=400,phase2.ctx_guard=true,phase2.delta_curv=0.0001,phase2.delta_reg=0.001]@gru
