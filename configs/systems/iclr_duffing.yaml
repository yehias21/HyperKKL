# iclr_duffing: the reverse Duffing oscillator of the ICLR workshop paper (Appendix A.1),
#   x1' = x2^3,  x2' = -x1 + u,  y = x1,  additive input, no actuator model.
# Design (nz, alpha, IC box, horizon, t_ref) as configs/systems/duffing.yaml.
name: iclr_duffing
plant: duffing_rev
role: dev
params: {}
sensors: [0]
ic_box:
- [-1, 1]
- [-1, 1]
T: 50
nz: 5
alpha: 3.0
u_scale: 1.0
t_ref: 1
u_bounds: []
mismatch: 0.0
dyn_rank: 32          # Dynamic HyperKKL rank r of Eq. 13 (32 oscillators, 128 chaotic)
