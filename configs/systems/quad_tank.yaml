# quad_tank: role = dev system (design decisions are made here).
# Sensors, IC box and nz from the archive. alpha, T and dt re-selected by verification: the plant's
# slowest mode is ~84 s (eig -0.0119/s) but the latent memory at alpha = 0.5 was 17 s, so the KKL map
# was ill-conditioned (1/sigma_min 544, cond 1295; decoder eps_dec 2.25 sigma). alpha = 0.1 gives
# 1/sigma_min 17.9, cond 227. dt is explicit: the design dt at alpha = 0.1 (0.26 s) aliased the old
# amplitude-OOD inputs (up to 12 rad/s). Under input protocol v2 the fastest input is am w_fast
# 5 / t_ref = 0.33 rad/s, so the design dt would suffice; dt = 0.05 is kept so the latent design,
# washout and earlier phase-1 diagnostics stay comparable. T = 300 s covers the longer washout (~84 s).
# t_ref (input protocol v2, signals.py): seconds per signal time unit. Rule t_ref = max(1, tau_slow / 3),
# rounded, with tau_slow = median 1/|Re eig| of the linearisation along the zero-input trajectory
# = 49 s -> t_ref = 15. T / t_ref = 300 / 15 = 20 signal time units (rule: >= ~20, so an episode holds enough input events).
name: quad_tank
plant: quad_tank
role: dev
params: {}
sensors: [0, 1]
ic_box:
- [6, 18]
- [6, 18]
- [0.5, 4]
- [0.5, 4]
T: 300
nz: 6
alpha: 0.1
dt: 0.05
u_scale: 1.0
t_ref: 15
u_bounds: []
actuator: {kind: saturating, u_bar: 2.0}
mismatch: 0.0
